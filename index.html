<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Spelling Master</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8fafc; --bg2: #ffffff; --bg3: #f1f5f9; --bg4: #e2e8f0;
  --text: #0f172a; --text2: #334155; --text3: #64748b; --text4: #94a3b8;
  --primary: #3b82f6; --primary-dark: #2563eb; --primary-light: #dbeafe;
  --accent: #8b5cf6; --accent-light: #ede9fe;
  --success: #10b981; --success-light: #d1fae5;
  --warning: #f59e0b; --warning-light: #fef3c7;
  --danger: #ef4444; --danger-light: #fee2e2;
  --border: #e2e8f0; --shadow: rgba(0,0,0,0.06);
  --radius: 12px; --radius-sm: 8px; --radius-lg: 16px;
  --font: 'Inter', -apple-system, sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --sidebar-w: 280px;
  --cat-commercial: #3b82f6; --cat-materials: #8b5cf6; --cat-health: #10b981;
  --cat-travel: #f59e0b; --cat-consonant: #ef4444; --cat-silent: #ec4899;
  --cat-ei: #06b6d4; --cat-morpho: #84cc16; --cat-homo: #f97316;
  --cat-awl1: #6366f1; --cat-awl2: #14b8a6; --cat-awl3: #a855f7;
  --cat-trends: #0ea5e9; --cat-proportional: #22c55e; --cat-maps: #eab308;
  --cat-process: #d946ef; --cat-linking: #64748b; --cat-gov: #dc2626;
  --cat-env: #16a34a; --cat-tech: #7c3aed; --cat-edu: #2563eb;
  --cat-crime: #991b1b; --cat-personality: #c026d3; --cat-art: #ea580c;
  --cat-synonyms: #0d9488;
}
[data-theme="dark"] {
  --bg: #0f172a; --bg2: #1e293b; --bg3: #1e293b; --bg4: #334155;
  --text: #f1f5f9; --text2: #cbd5e1; --text3: #94a3b8; --text4: #64748b;
  --primary-light: #1e3a5f; --accent-light: #2e1065;
  --success-light: #064e3b; --warning-light: #451a03; --danger-light: #450a0a;
  --border: #334155; --shadow: rgba(0,0,0,0.3);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font); background: var(--bg); color: var(--text); transition: background .3s, color .3s; overflow-x: hidden; }
::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: var(--bg); } ::-webkit-scrollbar-thumb { background: var(--text4); border-radius: 3px; }

/* Sidebar */
.sidebar { position: fixed; left: 0; top: 0; width: var(--sidebar-w); height: 100vh; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 100; transition: transform .3s; }
.sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); }
.sidebar-header h1 { font-size: 18px; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.sidebar-header p { font-size: 11px; color: var(--text3); margin-top: 2px; }
.sidebar-nav { flex: 1; overflow-y: auto; padding: 12px; }
.nav-section { margin-bottom: 16px; }
.nav-section-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text4); padding: 4px 8px; margin-bottom: 4px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text2); transition: all .15s; position: relative; }
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
.nav-item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.nav-item .badge { margin-left: auto; font-size: 10px; padding: 1px 6px; border-radius: 10px; background: var(--bg4); color: var(--text3); font-weight: 600; }
.sidebar-footer { padding: 16px; border-top: 1px solid var(--border); }
.xp-bar-wrap { margin-bottom: 8px; }
.xp-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text3); margin-bottom: 4px; }
.xp-bar { height: 6px; background: var(--bg4); border-radius: 3px; overflow: hidden; }
.xp-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); border-radius: 3px; transition: width .5s; }
.streak-info { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text3); }

/* Main content */
.main { margin-left: var(--sidebar-w); min-height: 100vh; }
.topbar { position: sticky; top: 0; z-index: 50; background: var(--bg2); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(10px); }
.topbar-left { display: flex; align-items: center; gap: 12px; }
.hamburger { display: none; background: none; border: none; cursor: pointer; color: var(--text); font-size: 20px; }
.topbar h2 { font-size: 16px; font-weight: 700; }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.theme-toggle { background: var(--bg3); border: 1px solid var(--border); border-radius: 20px; padding: 6px 12px; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 6px; color: var(--text2); transition: all .2s; }
.theme-toggle:hover { background: var(--bg4); }
.daily-goal { font-size: 12px; color: var(--text3); display: flex; align-items: center; gap: 6px; }
.daily-goal .count { font-weight: 700; color: var(--primary); }

.content { padding: 24px; max-width: 900px; margin: 0 auto; }

/* Cards */
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 20px; box-shadow: 0 1px 3px var(--shadow); transition: all .2s; }
.card:hover { box-shadow: 0 4px 12px var(--shadow); }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.card-title { font-size: 18px; font-weight: 700; }
.card-subtitle { font-size: 13px; color: var(--text3); margin-top: 2px; }

/* Dashboard stats */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; text-align: center; }
.stat-value { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.stat-label { font-size: 12px; color: var(--text3); margin-top: 4px; font-weight: 500; }

/* Mode cards */
.modes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; margin-bottom: 24px; }
.mode-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; cursor: pointer; transition: all .2s; position: relative; overflow: hidden; }
.mode-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--shadow); border-color: var(--primary); }
.mode-card .mode-icon { font-size: 32px; margin-bottom: 12px; }
.mode-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.mode-card p { font-size: 13px; color: var(--text3); line-height: 1.5; }
.mode-card .mode-tag { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px; margin-top: 8px; }

/* Practice area */
.practice-area { display: none; }
.practice-area.active { display: block; }
.practice-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.practice-progress { display: flex; align-items: center; gap: 12px; }
.progress-bar { width: 200px; height: 8px; background: var(--bg4); border-radius: 4px; overflow: hidden; }
.progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); transition: width .3s; border-radius: 4px; }
.progress-text { font-size: 13px; color: var(--text3); font-weight: 600; }
.lives { display: flex; gap: 4px; }
.life { font-size: 18px; transition: opacity .3s; }
.life.lost { opacity: 0.2; }

.word-card { background: var(--bg2); border: 2px solid var(--border); border-radius: var(--radius-lg); padding: 32px; text-align: center; margin-bottom: 20px; min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: border-color .3s; }
.word-card.correct { border-color: var(--success); background: var(--success-light); }
.word-card.wrong { border-color: var(--danger); background: var(--danger-light); }
.word-category-tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 12px; margin-bottom: 12px; }
.word-definition { font-size: 16px; color: var(--text2); margin-bottom: 16px; line-height: 1.6; max-width: 500px; }
.word-sentence { font-size: 14px; color: var(--text3); font-style: italic; margin-bottom: 16px; max-width: 500px; }
.word-difficulty { display: flex; gap: 4px; margin-bottom: 12px; }
.word-difficulty .star { color: var(--warning); font-size: 14px; }
.word-difficulty .star.empty { color: var(--bg4); }

.input-area { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
.spell-input { font-family: var(--mono); font-size: 20px; padding: 12px 20px; border: 2px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); text-align: center; width: 320px; max-width: 100%; outline: none; transition: border-color .2s; }
.spell-input:focus { border-color: var(--primary); }
.spell-input.correct { border-color: var(--success); background: var(--success-light); }
.spell-input.wrong { border-color: var(--danger); background: var(--danger-light); }

.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border: none; border-radius: var(--radius-sm); font-family: var(--font); font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s; }
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
.btn-secondary { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--bg4); }
.btn-success { background: var(--success); color: white; }
.btn-danger { background: var(--danger); color: white; }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-lg { padding: 14px 28px; font-size: 16px; }
.btn-icon { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 18px; padding: 6px; border-radius: 6px; transition: all .15s; }
.btn-icon:hover { background: var(--bg3); color: var(--text); }

.listen-btn { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--accent)); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 28px; color: white; transition: all .2s; margin-bottom: 16px; box-shadow: 0 4px 16px rgba(59,130,246,0.3); }
.listen-btn:hover { transform: scale(1.05); box-shadow: 0 6px 24px rgba(59,130,246,0.4); }
.listen-btn:active { transform: scale(0.95); }
.listen-btn.speaking { animation: pulse 1s infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(59,130,246,0.4); } 50% { box-shadow: 0 0 0 16px rgba(59,130,246,0); } }

.feedback { margin-top: 16px; padding: 12px 20px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; display: none; }
.feedback.show { display: block; animation: fadeIn .3s; }
.feedback.correct { background: var(--success-light); color: #065f46; border: 1px solid var(--success); }
.feedback.wrong { background: var(--danger-light); color: #991b1b; border: 1px solid var(--danger); }
.feedback .mnemonic { margin-top: 8px; font-size: 13px; font-style: italic; opacity: 0.8; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
@keyframes confetti-fall { 0% { transform: translateY(-100px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
.confetti-piece { position: fixed; top: -20px; width: 10px; height: 10px; z-index: 9999; animation: confetti-fall 3s ease-in forwards; }

/* Report */
.report-container { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.report-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.report-content { padding: 24px; }
.report-text { font-family: var(--mono); font-size: 12px; line-height: 1.7; white-space: pre-wrap; background: var(--bg); padding: 20px; border-radius: var(--radius-sm); border: 1px solid var(--border); color: var(--text2); max-height: 600px; overflow-y: auto; }
.copy-toast { position: fixed; bottom: 20px; right: 20px; background: var(--success); color: white; padding: 12px 20px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; display: none; z-index: 999; animation: fadeIn .3s; }

/* Achievements */
.achievements-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.achievement { padding: 16px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); text-align: center; opacity: 0.4; transition: all .3s; }
.achievement.earned { opacity: 1; background: var(--bg2); border-color: var(--warning); box-shadow: 0 0 12px rgba(245,158,11,0.1); }
.achievement .ach-icon { font-size: 32px; margin-bottom: 8px; }
.achievement .ach-name { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
.achievement .ach-desc { font-size: 11px; color: var(--text3); }

/* Category selector */
.cat-selector { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.cat-chip { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--bg); color: var(--text3); transition: all .2s; }
.cat-chip:hover { background: var(--bg3); }
.cat-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

/* Quick fix mode */
.misspelled-word { font-family: var(--mono); font-size: 28px; font-weight: 700; color: var(--danger); margin-bottom: 16px; letter-spacing: 2px; }

/* Responsive - Tablet */
@media (max-width: 1024px) {
  :root { --sidebar-w: 240px; }
  .content { padding: 20px; }
  .modes-grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
}

/* Responsive - Mobile */
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .hamburger { display: block; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat-card { padding: 12px 8px; }
  .stat-value { font-size: 22px; }
  .stat-label { font-size: 11px; }
  .modes-grid { grid-template-columns: 1fr; gap: 12px; }
  .mode-card { padding: 16px; }
  .mode-card .mode-icon { font-size: 26px; margin-bottom: 8px; }
  .mode-card h3 { font-size: 15px; }
  .mode-card p { font-size: 12px; }
  .content { padding: 14px; }
  .card { padding: 16px; margin-bottom: 14px; }
  .card-title { font-size: 16px; }
  .spell-input { width: 100%; font-size: 18px; padding: 10px 14px; }
  .progress-bar { width: 100px; }
  .progress-text { font-size: 12px; }
  .word-card { padding: 20px 14px; min-height: 160px; }
  .word-definition { font-size: 15px; }
  .word-sentence { font-size: 13px; }
  .word-reveal { font-size: 20px; }
  .misspelled-word { font-size: 22px; }
  .sentence-display { font-size: 16px; }
  .input-area { flex-direction: column; width: 100%; }
  .input-area .btn { width: 100%; justify-content: center; }
  .listen-btn { width: 56px; height: 56px; font-size: 24px; }
  .practice-header { flex-direction: column; gap: 10px; align-items: flex-start; }
  .practice-progress { width: 100%; }
  .progress-bar { flex: 1; }
  .topbar { padding: 10px 14px; }
  .topbar h2 { font-size: 14px; }
  .daily-goal { font-size: 11px; }
  .theme-toggle { padding: 5px 10px; font-size: 12px; }
  .cat-selector { gap: 6px; }
  .cat-chip { padding: 5px 10px; font-size: 11px; }
  .report-text { font-size: 11px; padding: 14px; max-height: 500px; }
  .report-header { padding: 14px; flex-direction: column; gap: 10px; align-items: flex-start; }
  .achievements-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .achievement { padding: 12px; }
  .achievement .ach-icon { font-size: 26px; }
  .achievement .ach-name { font-size: 12px; }
  .achievement .ach-desc { font-size: 10px; }
  .homophone-pair { gap: 10px; }
  .homophone-option { padding: 10px 18px; font-size: 14px; }
  .settings-row { flex-direction: column; align-items: flex-start; gap: 8px; }
  .feedback { font-size: 13px; padding: 10px 14px; }
  .back-btn { font-size: 12px; }
  .btn { padding: 8px 16px; font-size: 13px; }
  .btn-lg { padding: 12px 22px; font-size: 15px; }
}

/* Responsive - Small Mobile */
@media (max-width: 400px) {
  .stats-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat-value { font-size: 18px; }
  .content { padding: 10px; }
  .card { padding: 12px; border-radius: var(--radius); }
  .topbar-right { gap: 6px; }
  .daily-goal { display: none; }
  .spell-input { font-size: 16px; padding: 10px; }
  .word-card { padding: 16px 10px; }
  .word-definition { font-size: 14px; }
  .misspelled-word { font-size: 20px; }
  .achievements-grid { grid-template-columns: repeat(2, 1fr); }
  .modes-grid { gap: 10px; }
  .report-text { font-size: 10px; }
}
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 99; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.overlay.open { display: block; }

/* Touch-friendly improvements */
@media (hover: none) and (pointer: coarse) {
  .nav-item { padding: 10px 12px; min-height: 44px; }
  .btn { min-height: 44px; }
  .cat-chip { min-height: 36px; display: inline-flex; align-items: center; }
  .homophone-option { min-height: 48px; }
  .mode-card { padding: 18px; }
  .theme-toggle { min-height: 36px; }
  .spell-input { min-height: 48px; font-size: 16px; /* prevents iOS zoom */ }
  .listen-btn { width: 64px; height: 64px; }
}

/* Settings panel */
.settings-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
.settings-row:last-child { border: none; }
.settings-label { font-size: 14px; font-weight: 500; }
.settings-label small { display: block; font-size: 11px; color: var(--text3); font-weight: 400; }
select, .toggle-switch { font-family: var(--font); }
select { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 13px; }

.gap-word { display: inline-block; min-width: 120px; border-bottom: 2px dashed var(--primary); margin: 0 4px; }
.sentence-display { font-size: 18px; line-height: 2; color: var(--text); margin-bottom: 16px; }

/* Homophone mode special */
.homophone-pair { display: flex; gap: 16px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
.homophone-option { padding: 12px 24px; border: 2px solid var(--border); border-radius: var(--radius); cursor: pointer; font-size: 16px; font-weight: 600; transition: all .2s; background: var(--bg); }
.homophone-option:hover { border-color: var(--primary); background: var(--primary-light); }

.back-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text3); cursor: pointer; margin-bottom: 16px; padding: 6px 0; }
.back-btn:hover { color: var(--text); }

.word-reveal { font-family: var(--mono); font-size: 24px; font-weight: 700; letter-spacing: 2px; margin: 8px 0; }
.word-reveal.correct-reveal { color: var(--success); }
.word-reveal.wrong-reveal { color: var(--danger); text-decoration: line-through; }
</style>
</head>
<body>
<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h1>IELTS Spelling Master</h1>
    <p>Master your vocabulary</p>
  </div>
  <div class="sidebar-nav" id="sidebarNav"></div>
  <div class="sidebar-footer">
    <div class="xp-bar-wrap">
      <div class="xp-label"><span id="levelLabel">Level 1</span><span id="xpLabel">0 / 100 XP</span></div>
      <div class="xp-bar"><div class="xp-bar-fill" id="xpBarFill" style="width:0%"></div></div>
    </div>
    <div class="streak-info" id="streakInfo">Current streak: 0 days</div>
  </div>
</div>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- Main -->
<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="hamburger" onclick="toggleSidebar()">&#9776;</button>
      <h2 id="pageTitle">Dashboard</h2>
    </div>
    <div class="topbar-right">
      <div class="daily-goal">Today: <span class="count" id="dailyCount">0</span> / <span id="dailyGoalNum">20</span></div>
      <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">&#9789; Dark</button>
    </div>
  </div>
  <div class="content" id="contentArea"></div>
</div>
<div class="copy-toast" id="copyToast">Report copied to clipboard!</div>

<script>
// ===================== WORD DATABASE =====================
const WORDS = [
// LISTENING - Commercial & Retail

function defaultState() {

  try { const s = localStorage.getItem(LS_KEY); state = s ? {...defaultState(), ...JSON.parse(s)} : defaultState(); } catch(e) { state = defaultState(); }
  checkStreak();

function saveState() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){} }
function checkStreak() {
  const today = new Date().toISOString().split('T')[0];
  if (state.lastDate === today) return;
  const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
  if (state.lastDate === yesterday) { /* streak continues */ }
  else if (state.lastDate !== today) { state.streak = 0; }
  if (state.lastDate !== today) { state.dailyCount = 0; }
}
function recordActivity() {
  const today = new Date().toISOString().split('T')[0];
  if (state.lastDate !== today) { state.streak++; state.dailyCount = 0; }
  state.lastDate = today; state.dailyCount++; state.totalPracticed++;
  saveState();
}

// ===================== XP & LEVELS =====================
function xpForLevel(l) { return 80 + l * 40; }
function addXP(amount) {
  state.xp += amount;
  while (state.xp >= xpForLevel(state.level)) { state.xp -= xpForLevel(state.level); state.level++; triggerConfetti(); }
  saveState(); updateSidebar();
}
function getLevelTitle() {
  const l = state.level;
  if (l <= 3) return 'Beginner'; if (l <= 6) return 'Elementary'; if (l <= 10) return 'Intermediate';
  if (l <= 15) return 'Upper-Intermediate'; if (l <= 20) return 'Advanced'; return 'Expert';
}

// ===================== WORD STATS =====================
function getWordStat(word) {
  if (!state.wordStats[word]) state.wordStats[word] = { attempts: 0, correct: 0, lastSeen: 0, interval: 1, nextDue: 0 };
  return state.wordStats[word];
}
function recordWordResult(word, isCorrect) {
  const ws = getWordStat(word);
  ws.attempts++; if (isCorrect) ws.correct++;
  ws.lastSeen = Date.now();
  if (isCorrect) { ws.interval = Math.min(ws.interval * 2.5, 30); } else { ws.interval = 1; }
  ws.nextDue = Date.now() + ws.interval * 86400000;
  recordActivity(); addXP(isCorrect ? 10 : 2); checkAchievements();
}
function isMastered(word) { const ws = getWordStat(word); return ws.attempts >= 3 && (ws.correct / ws.attempts) >= 0.8; }
function getAccuracy(word) { const ws = getWordStat(word); return ws.attempts > 0 ? Math.round(ws.correct / ws.attempts * 100) : null; }

// ===================== SPACED REPETITION =====================
function getWordPool(cat) {
  let pool = cat ? CATEGORIES[cat] || [] : [...WORD_DB];
  // Sort: due words first, then unseen, then others
  const now = Date.now();
  pool.sort((a, b) => {
    const sa = getWordStat(a.w), sb = getWordStat(b.w);
    const da = sa.attempts === 0 ? -1 : (sa.nextDue <= now ? 0 : 1);
    const db = sb.attempts === 0 ? -1 : (sb.nextDue <= now ? 0 : 1);
    if (da !== db) return da - db;
    // Prioritize words with lower accuracy
    const aa = sa.attempts > 0 ? sa.correct / sa.attempts : 0.5;
    const ab = sb.attempts > 0 ? sb.correct / sb.attempts : 0.5;
    return aa - ab;
  });
  return pool;
}

function getCommonMisspelling(word) {
  const m = MISSPELLINGS[word];
  if (m) return m[Math.floor(Math.random() * m.length)];
  // Generate a random misspelling
  const w = word; const i = Math.floor(Math.random() * (w.length - 2)) + 1;
  const ops = [
    () => w.slice(0,i) + w.slice(i+1), // delete
    () => w.slice(0,i) + w[i+1] + w[i] + w.slice(i+2), // swap
    () => w.slice(0,i) + w[i] + w[i] + w.slice(i+1), // double
    () => { const v = 'aeiou'; return w.slice(0,i) + v[Math.floor(Math.random()*5)] + w.slice(i+1); } // replace vowel
  ];
  const result = ops[Math.floor(Math.random() * ops.length)]();
  return result !== word ? result : word.slice(0, -1);
}

// ===================== SPEECH =====================
function speak(text, cb) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = state.settings.voiceRate || 0.9;
  u.volume = 1.0;
  u.lang = state.settings.voiceLang || 'en-GB';
  const voices = window.speechSynthesis.getVoices();
  const pref = voices.find(v => v.lang.startsWith('en-GB')) || voices.find(v => v.lang.startsWith('en'));
  if (pref) u.voice = pref;
  if (cb) u.onend = cb;
  window.speechSynthesis.speak(u);
}

function triggerConfetti() {
  const colors = ['#3b82f6','#8b5cf6','#10b981','#f59e0b','#ef4444','#ec4899'];
  for (let i = 0; i < 40; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.width = (6 + Math.random() * 8) + 'px';
    el.style.height = (6 + Math.random() * 8) + 'px';
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    el.style.animationDuration = (2 + Math.random() * 2) + 's';
    el.style.animationDelay = Math.random() * 0.5 + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
}

      <div class="mode-card" onclick="startMode('listen')"><div class="mode-icon">&#128266;</div><h3>Listen & Spell</h3><p>Hear the word and type it correctly</p></div>
      <div class="mode-card" onclick="startMode('definition')"><div class="mode-icon">&#128214;</div><h3>Definition Match</h3><p>Type the word that matches the definition</p></div>
      <div class="mode-card" onclick="startMode('gap')"><div class="mode-icon">&#9999;</div><h3>Fill the Gap</h3><p>Fill in the missing word in a sentence</p></div>
      <div class="mode-card" onclick="startMode('bee')"><div class="mode-icon">&#128029;</div><h3>Spelling Bee</h3><p>Progressive difficulty with lives</p></div>
      <div class="mode-card" onclick="startMode('quickfix')"><div class="mode-icon">&#128295;</div><h3>Quick Fix</h3><p>Fix the misspelled word</p></div>
      <div class="mode-card" onclick="startMode('infinity')" style="border:2px dashed var(--accent);background:linear-gradient(135deg, var(--accent-light), var(--primary-light));"><div class="mode-icon">&#9854;</div><h3>Infinity Mode</h3><p>Endless practice, all categories, random modes</p></div>
    </div>
    <div class="card">
      <div class="card-title" style="margin-bottom:12px">Select Categories</div>
      <div class="cat-selector" id="catSelector">
        <div class="cat-chip active" onclick="toggleCatFilter(this, null)">All</div>
        ${CAT_LIST.map(c => `<div class="cat-chip" onclick="toggleCatFilter(this, '${c}')">${c}</div>`).join('')}
      </div>
    </div>
  `;
}

let selectedCats = [];
function toggleCatFilter(el, cat) {
  if (!cat) { selectedCats = []; document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active')); el.classList.add('active'); return; }
  document.querySelector('.cat-chip.active:first-child')?.classList.remove('active');
  el.classList.toggle('active');
  if (el.classList.contains('active')) { selectedCats.push(cat); } else { selectedCats = selectedCats.filter(c => c !== cat); }
  if (selectedCats.length === 0) document.querySelector('.cat-chip').classList.add('active');
}

function startMode(mode) {
  const modes = {
    listen: { title:'Listen & Spell', type:'listen' },
    definition: { title:'Definition Match', type:'definition' },
    gap: { title:'Fill the Gap', type:'gap' },
    bee: { title:'Spelling Bee', type:'bee' },
    quickfix: { title:'Quick Fix', type:'quickfix' },
    infinity: { title:'Infinity Mode', type:'infinity' },
  };
  currentMode = modes[mode];
  currentPage = 'mode';
  buildSidebar(); render();
}

function startPracticeSession() {
  let pool = [];
  if (currentMode.type === 'infinity') {
    pool = getWordPool(null);
    if (pool.length === 0) pool = [...WORD_DB];
    // Shuffle all words for infinity
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
    practiceState = {
      words: pool, current: 0, correct: 0, total: pool.length,
      lives: Infinity, streak: 0, maxStreak: 0, answered: false,
      infinity: true, infinityModes: ['listen','definition','gap','quickfix'],
      infinityTotal: 0, infinityCorrect: 0
    };
  } else {
    if (selectedCats.length > 0) { selectedCats.forEach(c => pool.push(...getWordPool(c))); }
    else if (currentCat) { pool = getWordPool(currentCat); }
    else { pool = getWordPool(null); }
    if (pool.length === 0) { pool = [...WORD_DB]; }
    const shuffled = pool.slice(0, 20);
    practiceState = {
      words: shuffled, current: 0, correct: 0, total: shuffled.length,
      lives: currentMode.type === 'bee' ? 3 : Infinity,
      streak: 0, maxStreak: 0, answered: false, infinity: false
    };
  }
  renderPracticeUI();
}

function renderPracticeUI() {
  const ps = practiceState;
  const area = document.getElementById('contentArea');

  // Infinity mode: recycle words when pool exhausted
  if (ps.infinity && ps.current >= ps.total) {
    for (let i = ps.words.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [ps.words[i],ps.words[j]]=[ps.words[j],ps.words[i]]; }
    ps.current = 0;
  }

  if (!ps.infinity && (ps.current >= ps.total || ps.lives <= 0)) { renderPracticeResults(); return; }
  if (ps.lives <= 0) { renderPracticeResults(); return; }

  const word = ps.words[ps.current];
  const catColor = CAT_COLORS[word.cat] || '#999';
  const difficulty = word.d;

  // For infinity mode, pick a random sub-mode each question
  let activeType = currentMode.type;
  if (ps.infinity) {
    activeType = ps.infinityModes[Math.floor(Math.random() * ps.infinityModes.length)];
    ps.currentSubMode = activeType;
  }

  const speakerBtn = `<button class="listen-btn" id="listenBtn" onclick="speakWord()" title="Listen to word">&#128266;</button>`;

  let content = '';
  const infinityStats = ps.infinity ? `<span style="font-size:13px;color:var(--accent);font-weight:700;">&#8734; Infinity</span>` : '';
  const progressPct = ps.infinity ? 0 : (ps.current/ps.total*100);
  const progressLabel = ps.infinity ? `Word #${ps.infinityTotal + 1}` : `${ps.current + 1} / ${ps.total}`;
  const scoreLabel = ps.infinity ? `${ps.infinityCorrect}/${ps.infinityTotal}` : `${ps.correct}/${ps.current}`;

  const header = `
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div class="back-btn" onclick="${ps.infinity ? 'endInfinityMode()' : "navigate('dashboard')"}">&larr; ${ps.infinity ? 'End Run' : 'Back'}</div>
      ${ps.infinity ? `<button class="btn btn-danger btn-sm" onclick="endInfinityMode()">&#9632; Stop</button>` : ''}
    </div>
    <div class="practice-header">
      <div class="practice-progress">
        ${ps.infinity ? infinityStats : `<div class="progress-bar"><div class="progress-bar-fill" style="width:${progressPct}%"></div></div>`}
        <span class="progress-text">${progressLabel}</span>
      </div>
      <div style="display:flex;align-items:center;gap:16px;">
        ${currentMode.type === 'bee' ? `<div class="lives">${Array(3).fill(0).map((_,i) => `<span class="life${i >= ps.lives ? ' lost' : ''}">&#10084;</span>`).join('')}</div>` : ''}
        <span style="font-size:13px;color:var(--text3);">Score: ${scoreLabel}</span>
      </div>
    </div>
  `;

  const inputArea = `
    <div class="input-area">
      <input type="text" class="spell-input" id="spellInput" placeholder="Type the word..." autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="handlePracticeKey(event)">
      <button class="btn btn-primary" id="checkBtn" onclick="checkAnswer()">Check</button>
    </div>
    <div class="feedback" id="feedback"></div>
  `;

  if (activeType === 'listen') {
    content = `${header}
      <div class="word-card" id="wordCard">
        <span class="word-category-tag" style="background:${catColor}20;color:${catColor}">${word.cat}</span>
        <div class="word-difficulty">${Array(3).fill(0).map((_,i)=>`<span class="star${i<difficulty?'':' empty'}">&#9733;</span>`).join('')}</div>
        ${speakerBtn}
        <p style="font-size:13px;color:var(--text3);margin-bottom:16px;">Click to hear the word, then type it below</p>
        ${inputArea}
      </div>`;
  } else if (activeType === 'definition') {
    content = `${header}
      <div class="word-card" id="wordCard">
        <span class="word-category-tag" style="background:${catColor}20;color:${catColor}">${word.cat}</span>
        <div class="word-difficulty">${Array(3).fill(0).map((_,i)=>`<span class="star${i<difficulty?'':' empty'}">&#9733;</span>`).join('')}</div>
        ${speakerBtn}
        <div class="word-definition">${word.def}</div>
        ${inputArea}
      </div>`;
  } else if (activeType === 'gap') {
    const sentence = word.ex.replace('___', `<span class="gap-word">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>`);
    content = `${header}
      <div class="word-card" id="wordCard">
        <span class="word-category-tag" style="background:${catColor}20;color:${catColor}">${word.cat}</span>
        ${speakerBtn}
        <div class="sentence-display">${sentence}</div>
        <p style="font-size:13px;color:var(--text3);margin-bottom:12px;">${word.def}</p>
        ${inputArea}
      </div>`;
  } else if (activeType === 'bee') {
    content = `${header}
      <div class="word-card" id="wordCard">
        <span class="word-category-tag" style="background:${catColor}20;color:${catColor}">${word.cat}</span>
        <div class="word-difficulty">${Array(3).fill(0).map((_,i)=>`<span class="star${i<difficulty?'':' empty'}">&#9733;</span>`).join('')}</div>
        ${speakerBtn}
        <div class="word-definition">${word.def}</div>
        <p style="font-size:12px;color:var(--text4);margin-bottom:12px;">${word.ex.replace(word.w, '___').replace('___', '___')}</p>
        ${inputArea}
      </div>`;
  } else if (activeType === 'quickfix') {
    const misspelled = getCommonMisspelling(word.w);
    practiceState.misspelled = misspelled;
    content = `${header}
      <div class="word-card" id="wordCard">
        <span class="word-category-tag" style="background:${catColor}20;color:${catColor}">${word.cat}</span>
        ${speakerBtn}
        <p style="font-size:13px;color:var(--text3);margin-bottom:8px;">Fix this misspelling:</p>
        <div class="misspelled-word">${misspelled}</div>
        <p style="font-size:13px;color:var(--text3);margin-bottom:12px;">Hint: ${word.def}</p>
        ${inputArea}
      </div>`;
  }
  area.innerHTML = content;
  practiceState.answered = false;
  setTimeout(() => { const inp = document.getElementById('spellInput'); if (inp) inp.focus(); }, 100);
  if (activeType === 'listen' || activeType === 'bee') { setTimeout(() => speakWord(), 300); }
}

function handlePracticeKey(event) {
  if (event.key === 'Enter') {
    event.preventDefault();
    if (practiceState.answered) { nextWord(); } else { checkAnswer(); }
  }
}

function speakWord() {
  const word = practiceState.words[practiceState.current];
  const btn = document.getElementById('listenBtn');
  if (btn) btn.classList.add('speaking');
  speak(word.w, () => { if (btn) btn.classList.remove('speaking'); });
}

function checkAnswer() {
  if (practiceState.answered) { nextWord(); return; }
  const input = document.getElementById('spellInput');
  const word = practiceState.words[practiceState.current];
  const answer = input.value.trim().toLowerCase();
  const correct = word.w.toLowerCase();
  const isCorrect = answer === correct;

  practiceState.answered = true;
  recordWordResult(word.w, isCorrect);

  // Track infinity mode stats
  if (practiceState.infinity) {
    practiceState.infinityTotal++;
    if (isCorrect) practiceState.infinityCorrect++;
  }

  const card = document.getElementById('wordCard');
  const fb = document.getElementById('feedback');

  if (isCorrect) {
    practiceState.correct++;
    practiceState.streak++;
    if (practiceState.streak > practiceState.maxStreak) practiceState.maxStreak = practiceState.streak;
    if (practiceState.streak >= 10 && !state.achievements.perfect_10) { state.achievements.perfect_10 = true; saveState(); }
    input.classList.add('correct');
    card.classList.add('correct');
    fb.className = 'feedback show correct';
    fb.innerHTML = `&#10004; Correct! <span class="word-reveal correct-reveal">${word.w}</span>`;
  } else {
    practiceState.streak = 0;
    if (currentMode.type === 'bee') practiceState.lives--;
    input.classList.add('wrong');
    card.classList.add('wrong');
    fb.className = 'feedback show wrong';
    const tip = getMnemonicTip(word.w);
    fb.innerHTML = `&#10008; The correct spelling is: <span class="word-reveal wrong-reveal">${answer}</span> &rarr; <span class="word-reveal correct-reveal">${word.w}</span>
      ${tip ? `<div class="mnemonic">Tip: ${tip}</div>` : ''}`;
  }

  // Change button to Next + hint to press Enter
  const btn = document.getElementById('checkBtn');
  if (btn) { btn.textContent = 'Next ↵'; btn.onclick = nextWord; }
  input.disabled = true;
  // Keep focus so Enter still works for next
  input.focus();
  updateSidebar();
}

function nextWord() {
  practiceState.current++;
  renderPracticeUI();
}

function renderPracticeResults() {
  const ps = practiceState;
  const totalAnswered = ps.infinity ? ps.infinityTotal : ps.current;
  const totalCorrect = ps.infinity ? ps.infinityCorrect : ps.correct;
  const acc = totalAnswered > 0 ? Math.round(totalCorrect / totalAnswered * 100) : 0;
  // Save to history
  state.history.push({ date: new Date().toISOString().split('T')[0], accuracy: acc, wordsCount: totalAnswered, mode: ps.infinity ? 'Infinity' : currentMode.title });
  saveState();
  if (acc >= 80) triggerConfetti();

  const area = document.getElementById('contentArea');
  area.innerHTML = `
    <div class="card" style="text-align:center;">
      <div style="font-size:48px;margin-bottom:16px;">${acc >= 80 ? '&#127881;' : acc >= 50 ? '&#128170;' : '&#128218;'}</div>
      <h2 style="font-size:24px;font-weight:800;margin-bottom:8px;">${ps.infinity ? 'Infinity Run Complete!' : 'Session Complete!'}</h2>
      <p style="color:var(--text3);margin-bottom:24px;">You scored ${totalCorrect} out of ${totalAnswered}</p>
      <div class="stats-grid" style="max-width:500px;margin:0 auto 24px;">
        <div class="stat-card"><div class="stat-value">${acc}%</div><div class="stat-label">Accuracy</div></div>
        <div class="stat-card"><div class="stat-value">${ps.maxStreak}</div><div class="stat-label">Best Streak</div></div>
        <div class="stat-card"><div class="stat-value">${totalAnswered}</div><div class="stat-label">Words Attempted</div></div>
      </div>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
        <button class="btn btn-primary btn-lg" onclick="startPracticeSession()">Practice Again</button>
        <button class="btn btn-secondary btn-lg" onclick="navigate('dashboard')">Back to Dashboard</button>
        <button class="btn btn-secondary btn-lg" onclick="navigate('report')">View Report</button>
      </div>
    </div>
  `;
}

function endInfinityMode() {
  practiceState.infinity = false;
  practiceState.lives = 0;
  renderPracticeResults();
}

// ===================== CATEGORY VIEW =====================
function renderCategory() {
  const words = CATEGORIES[currentCat] || [];
  const catColor = CAT_COLORS[currentCat] || '#999';
  const mastered = words.filter(w => isMastered(w.w)).length;
  return `
    <div class="back-btn" onclick="navigate('dashboard')">&larr; Back</div>
    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title" style="display:flex;align-items:center;gap:8px;">
            <span class="dot" style="background:${catColor};width:12px;height:12px;border-radius:50%"></span>${currentCat}
          </div>
          <div class="card-subtitle">${mastered} of ${words.length} words mastered</div>
        </div>
        <button class="btn btn-primary" onclick="selectedCats=['${currentCat}'];startMode('definition')">Practice This Category</button>
      </div>
      <div style="height:8px;background:var(--bg4);border-radius:4px;overflow:hidden;margin-bottom:20px;">
        <div style="height:100%;width:${mastered/words.length*100}%;background:${catColor};border-radius:4px;transition:width .3s"></div>
      </div>
      <div style="display:grid;gap:8px;">
        ${words.map(w => {
          const ws = getWordStat(w.w);
          const acc = getAccuracy(w.w);
          const m = isMastered(w.w);
          return `<div style="display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--bg3);border-radius:var(--radius-sm);border-left:3px solid ${m ? 'var(--success)' : ws.attempts > 0 ? 'var(--warning)' : 'var(--bg4)'}">
            <span style="font-family:var(--mono);font-weight:600;width:180px;">${w.w}</span>
            <span style="font-size:12px;color:var(--text3);flex:1;">${w.def}</span>
            <span style="font-size:11px;color:var(--text4);">${acc !== null ? acc + '%' : 'New'}</span>
            ${m ? '<span style="color:var(--success);font-size:14px;">&#10004;</span>' : ''}
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
}

// ===================== ACHIEVEMENTS VIEW =====================
function renderAchievements() {
  return `
    <div class="achievements-grid">
      ${ACHIEVEMENTS.map(a => {
        const earned = !!state.achievements[a.id];
        return `<div class="achievement${earned ? ' earned' : ''}">
          <div class="ach-icon">${a.icon}</div>
          <div class="ach-name">${a.name}</div>
          <div class="ach-desc">${a.desc}</div>
          ${earned ? `<div style="font-size:10px;color:var(--success);margin-top:4px;">Earned ${new Date(state.achievements[a.id]).toLocaleDateString()}</div>` : ''}
        </div>`;
      }).join('')}
    </div>
  `;
}

// ===================== REPORT =====================
function renderReport() {
  const report = generateReport();
  return `
    <div class="report-container">
      <div class="report-header">
        <div class="card-title">Progress Report</div>
        <button class="btn btn-primary" onclick="copyReport()">&#128203; Copy Report</button>
      </div>
      <div class="report-content">
        <div class="report-text" id="reportText">${escapeHtml(report)}</div>
      </div>
    </div>
  `;
}

function generateReport() {
  const mastered = Object.keys(state.wordStats).filter(w => isMastered(w));
  const inProgress = Object.keys(state.wordStats).filter(w => !isMastered(w) && getWordStat(w).attempts > 0);
  const totalAcc = Object.values(state.wordStats).reduce((a,s) => a + s.correct, 0);
  const totalAtt = Object.values(state.wordStats).reduce((a,s) => a + s.attempts, 0);
  const acc = totalAtt > 0 ? Math.round(totalAcc / totalAtt * 100) : 0;

  // Problem words
  const problems = Object.entries(state.wordStats)
    .filter(([w, s]) => s.attempts >= 2 && (s.correct / s.attempts) < 0.6)
    .sort((a, b) => (a[1].correct / a[1].attempts) - (b[1].correct / b[1].attempts))
    .slice(0, 20);

  // Category breakdown
  const catBreakdown = CAT_LIST.map(cat => {
    const words = CATEGORIES[cat];
    const m = words.filter(w => isMastered(w.w)).length;
    const catAcc = words.reduce((a, w) => {
      const s = getWordStat(w.w);
      return { c: a.c + s.correct, t: a.t + s.attempts };
    }, { c: 0, t: 0 });
    const pct = catAcc.t > 0 ? Math.round(catAcc.c / catAcc.t * 100) : 0;
    return `  ${cat.padEnd(30)} ${String(pct + '%').padStart(4)} (${m}/${words.length} mastered)`;
  }).join('\n');

  // Achievements
  const earnedAch = ACHIEVEMENTS.filter(a => state.achievements[a.id])
    .map(a => `  [x] ${a.name} - ${a.desc}`).join('\n') || '  None yet';

  // History
  const historyLines = (state.history || []).slice(-10)
    .map(h => `  ${h.date}: ${h.accuracy}% (${h.wordsCount} words)`).join('\n') || '  No sessions recorded yet';

  const today = new Date().toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });

  return `${'='.repeat(50)}
    IELTS SPELLING PROGRESS REPORT
${'='.repeat(50)}
Date: ${today}
Student Level: Level ${state.level} - ${getLevelTitle()}
Overall Accuracy: ${acc}%
Total Words Practiced: ${state.totalPracticed}
Words Mastered: ${mastered.length} / ${WORD_DB.length}
Words In Progress: ${inProgress.length}
Current Streak: ${state.streak} days
Daily Goal: ${state.dailyCount} / ${state.dailyGoal}

${'─'.repeat(40)}
  CATEGORY BREAKDOWN
${'─'.repeat(40)}
${catBreakdown}

${'─'.repeat(40)}
  PROBLEM WORDS
${'─'.repeat(40)}
${problems.length > 0 ? problems.map(([w, s]) =>
  `  ${w.padEnd(25)} attempted ${s.attempts}x, accuracy ${Math.round(s.correct/s.attempts*100)}%`
).join('\n') : '  No problem words identified yet'}

${'─'.repeat(40)}
  ACHIEVEMENTS
${'─'.repeat(40)}
${earnedAch}

${'─'.repeat(40)}
  SESSION HISTORY (Last 10)
${'─'.repeat(40)}
${historyLines}

${'─'.repeat(40)}
  MASTERED WORDS (${mastered.length})
${'─'.repeat(40)}
${mastered.length > 0 ? '  ' + mastered.sort().join(', ') : '  None yet - keep practicing!'}

${'='.repeat(50)}
  Generated by IELTS Spelling Master
  Total words in database: ${WORD_DB.length}
${'='.repeat(50)}`;
}

function copyReport() {
  const text = document.getElementById('reportText').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const toast = document.getElementById('copyToast');
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 2500);
  });
}

function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ===================== SETTINGS =====================
function renderSettings() {
  return `
    <div class="card">
      <div class="card-title" style="margin-bottom:16px">Settings</div>
      <div class="settings-row">
        <div class="settings-label">Daily Goal<small>Words to practice per day</small></div>
        <select onchange="state.dailyGoal=parseInt(this.value);saveState();updateSidebar();">
          ${[10,15,20,30,50].map(n=>`<option value="${n}"${state.dailyGoal===n?' selected':''}>${n} words</option>`).join('')}
        </select>
      </div>
      <div class="settings-row">
        <div class="settings-label">Voice Speed<small>Speed of word pronunciation</small></div>
        <select onchange="state.settings.voiceRate=parseFloat(this.value);saveState();">
          ${[{v:0.6,l:'Slow'},{v:0.8,l:'Normal'},{v:0.9,l:'Default'},{v:1.0,l:'Fast'}].map(o=>`<option value="${o.v}"${state.settings.voiceRate===o.v?' selected':''}>${o.l}</option>`).join('')}
        </select>
      </div>
      <div class="settings-row">
        <div class="settings-label">Voice Accent<small>Pronunciation accent</small></div>
        <select onchange="state.settings.voiceLang=this.value;saveState();">
          ${[{v:'en-GB',l:'British English'},{v:'en-US',l:'American English'},{v:'en-AU',l:'Australian English'}].map(o=>`<option value="${o.v}"${state.settings.voiceLang===o.v?' selected':''}>${o.l}</option>`).join('')}
        </select>
      </div>
      <div class="settings-row">
        <div class="settings-label">Reset Progress<small>Clear all data and start fresh</small></div>
        <button class="btn btn-danger btn-sm" onclick="if(confirm('Are you sure? This will delete all progress.')){localStorage.removeItem('${LS_KEY}');location.reload();}">Reset All Data</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title" style="margin-bottom:8px">Word Database Stats</div>
      <p style="font-size:13px;color:var(--text3);">Total words: <strong>${WORD_DB.length}</strong> across <strong>${CAT_LIST.length}</strong> categories</p>
    </div>
  `;
}

// ===================== INIT =====================
function init() {
  loadState();
  if (state.theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.getElementById('themeBtn').innerHTML = '&#9788; Light';
  }
  // Preload voices
  if (window.speechSynthesis) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); }
  buildSidebar(); updateSidebar(); render();
}
init();
</script>
</body>
</html>
